{{- /* Dos Services: Argo Rollouts reescribe sus selectores para separar el tráfico estable del canary. */ -}}
{{- range $suffix := list "" "-canary" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.name" $ }}{{ $suffix }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "service.selectorLabels" $ | nindent 4 }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
{{- end }}
