{{- if .Values.secrets.items }}
# Los valores viven en el gestor de secretos de la nube; ESO los materializa en un Secret.
# Si un secreto no tiene versión, el ExternalSecret queda en error y el rollout no avanza:
# falla temprano y visible, en vez de arrancar el pod con una variable vacía.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "service.secretName" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.storeRef.kind }}
    name: {{ .Values.secrets.storeRef.name }}
  target:
    name: {{ include "service.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.secrets.items }}
    - secretKey: {{ .env }}
      remoteRef:
        key: {{ .remoteKey }}
    {{- end }}
{{- end }}
