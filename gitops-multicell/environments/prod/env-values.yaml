# Prod: autoescalado, análisis obligatorio y una rampa más lenta.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
podDisruptionBudget:
  enabled: true
  minAvailable: 2
rollout:
  canary:
    steps:
      - setWeight: 10
      - pause: { duration: 2m }
      - setWeight: 30
      - pause: { duration: 5m }
      - setWeight: 60
      - pause: { duration: 5m }
  analysis:
    enabled: true
    successRate: 0.995
env:
  LOG_LEVEL: warn
