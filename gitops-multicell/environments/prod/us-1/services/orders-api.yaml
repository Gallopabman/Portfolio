image:
  repository: ghcr.io/gallopabman/orders-api
  tag: "7a2b9d4"
serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: "{{ .Values.name }}@{{ .Values.cloud.project }}.iam.gserviceaccount.com"
env:
  PAYMENTS_URL: "http://payments-api.apps.svc:8080"
  CLOUD_REGION: "{{ .Values.cell.region }}"
# La base usa autenticación IAM con la identidad del pod (ver cloud/modules/workload): sin contraseña.
secrets:
  items:
    - env: JWT_SIGNING_KEY
      remoteKey: orders-api-jwt-signing-key
autoscaling:
  maxReplicas: 30
