name: gitops-multicell

on:
  pull_request:
    paths: ["gitops-multicell/**", ".github/workflows/gitops-multicell.yml"]
  push:
    branches: [main]
    paths: ["gitops-multicell/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gitops-multicell
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Instalar kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: helm lint
        run: helm lint charts/service --set name=lint --set image.repository=example/lint --set image.tag=abc1234

      - name: Render y validación de todas las celdas
        run: OUT=rendered ./scripts/render-all.sh

      # En un PR, el diff de manifiestos renderizados muestra el impacto real del cambio en cada
      # celda (no el diff del values), que es lo que hay que revisar antes de aprobar.
      - name: Diff de manifiestos contra main
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git worktree add /tmp/base FETCH_HEAD
          (cd /tmp/base/gitops-multicell && OUT=/tmp/rendered-base ./scripts/render-all.sh >/dev/null || true)
          diff -ruN /tmp/rendered-base rendered > manifests.diff || true
          { echo '### Cambios en los manifiestos renderizados'; echo '```diff'; head -c 60000 manifests.diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
